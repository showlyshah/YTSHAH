name: Build test APK

# Builds a debug APK on every push to the clean rebuild branch (and on demand),
# then publishes it to the "test-build" pre-release so it can be installed on a phone.

on:
  push:
    branches: [rebuild/clean-baseline]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ViewTube-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ViewTube-test-apk
          path: ViewTube-test.apk

      - name: Publish to the test-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build ViewTube-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build (latest)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Download ViewTube-test.apk and install it on your phone (allow 'Install unknown apps' for your browser or file manager)."
